{{- if .Values.serviceAccount.create}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ include "pqs.serviceAccountName" . }}"
  namespace: "{{ .Release.Namespace }}"
  {{- if .Values.serviceAccount.annotations }}
  annotations:
    {{ toYaml .Values.serviceAccount.annotations | nindent 4 }}
  {{- end }}
  {{- end }}
