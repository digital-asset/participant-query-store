{{- if .Values.autoPrune.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-pruner
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  schedule: {{ .Values.autoPrune.interval }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}
        spec:
          serviceAccount: {{ include "pqs.serviceAccountName" . }}
          restartPolicy: OnFailure
          {{- if .Values.initContainers }}
          initContainers:
            {{- toYaml .Values.initContainers | nindent 12 }}
          {{- end }}
          containers:
            - name: pqs-pruner
              image: {{ .Values.image.repo }}/participant-query-store:{{ .Values.image.tag | default .Chart.AppVersion }}
              command: ["java", "-jar", "/scribe.jar"]
              args:
                  - "datastore"
                  - "postgres-document"
                  - "prune"
                  - "--prune-target"
                  - {{ .Values.autoPrune.maxAge }}
                  - "--postgres-schema"
                  - "pqs"
                  - "--postgres-host"
                  - {{ .Values.pqs.target.postgres.host }}
                  - "--postgres-database"
                  - {{ .Values.pqs.target.postgres.database }}
                  - "--postgres-username"
                  - {{ .Values.pqs.target.postgres.username }}
                  - "--prune-mode"
                  - Force
                  - "--logger-destination"
                  - "/tmp/output.log"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}