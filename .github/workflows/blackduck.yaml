name: Blackduck
on:
  schedule:
    - cron: "0 3 * * *" # Nightly at 03:00 UTC
  workflow_dispatch: # Enables manual triggering

env:
  MILL_OPTS: "-Dcoursier.cache.dir=/data/coursier"

defaults:
  run:
    shell: bash -euo pipefail -c "source nix.source && exec bash -euo pipefail {0}"

jobs:
  set-branches:
    runs-on: digital-asset-participant-query-store
    outputs:
      branches: ${{ steps.set.outputs.branches }}
    steps:
      - id: set
        # On schedule, scan every maintained branch; on dispatch, scan the selected branch.
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo 'branches=["main", "release-line-3.6", "release-line-3.7"]' >> "$GITHUB_OUTPUT"
          else
            echo "branches=[\"$GITHUB_REF_NAME\"]" >> "$GITHUB_OUTPUT"
          fi

  blackduck-scan:
    needs: set-branches
    runs-on: digital-asset-participant-query-store
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.set-branches.outputs.branches) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
      - uses: ./.github/actions/nix
      - uses: ./.github/actions/gen-version
      - run: make populate-blackduck-dir
      - run: ls -alhR .blackduck-input/
      - name: Blackduck Scan
        run: blackduck_scan -p "${GITHUB_REPOSITORY_OWNER}_${GITHUB_REPOSITORY#*/}" -b "${{ matrix.branch }}" -c MAJOR,CRITICAL,BLOCKER
        env:
          BLACKDUCK_HUBDETECT_TOKEN: ${{ secrets.DA_BLACKDUCK }}
      - name: Sanitize branch name
        id: sanitize
        run: echo "name=${BRANCH//\//-}" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ matrix.branch }}
      - name: Store Blackduck Scan
        uses: actions/upload-artifact@v7
        with:
          name: blackduck-report-${{ steps.sanitize.outputs.name }}
          path: /home/runner/blackduck/runs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Send slack notification
        if: failure() && github.event_name == 'schedule'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Blackduck scan failed",
              "attachments": [
                {
                  "color": "#FF0000",
                  "blocks": [
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Repository:*\n${{ github.repository }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Branch:*\n${{ matrix.branch }}"
                        }
                      ]
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "Visit job"
                          },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
