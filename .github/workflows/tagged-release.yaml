name: Tagged release
on: 
  push:
    tags:
      - 'v[0-9]*'

env:
  MILL_OPTS: "-Dcoursier.cache.dir=/data/coursier"

defaults:
  run:
    shell: bash -euo pipefail -c "source nix.source && exec bash -euo pipefail {0}"

jobs:
  build:
    runs-on: digital-asset-participant-query-store
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix
      - name: Check copyright headers
        run: make copyright-check
      - uses: ./.github/actions/gen-version
        id: gen-version
      - run: make prefetch-deps
      - name: Build & Package
        run: make build package populate-dist-dir
      - uses: ./.github/actions/render-dashboard
        with:
          version: v9.4.0
      - uses: ./.github/actions/render-dashboard
        with:
          version: v10.4.0
      - uses: ./.github/actions/render-dashboard
        with:
          version: v11.0.0
      - run: make populate-blackduck-dir
      - name: Blackduck Scan
        run: blackduck_scan -p "${GITHUB_REPOSITORY_OWNER}_${GITHUB_REPOSITORY#*/}" -b "$GITHUB_REF_NAME" -c MAJOR,CRITICAL,BLOCKER
        env:
          BLACKDUCK_HUBDETECT_TOKEN: ${{ secrets.DA_BLACKDUCK }}
      - name: Edit NOTICES
        run: |
          sed '3d' /home/runner/blackduck/runs/*_Black_Duck_Notices_Report.txt \
          > .dist/$(cat VERSION)/NOTICES
      - run: ls -alhR .dist/
      - name: Store dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: .dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Store Blackduck Scan
        uses: actions/upload-artifact@v7
        with:
          name: blackduck-report
          path: /home/runner/blackduck/runs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  ship-docker:
    runs-on: digital-asset-participant-query-store
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix
      - uses: ./.github/actions/gen-version
      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: europe-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.DA_IMAGES }}
      - name: Restore dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: .dist
      - name: Setup Buildx
        run: docker buildx create --use --platform=linux/amd64,linux/arm64 --name multi-platform-builder
      - name: Docker build print
        run: make docker/images/pqs/build BAKE_ACTION='--print'
      - name: Docker build-debug print
        run: make docker/images/pqs/build-debug BAKE_ACTION='--print'
      - name: Docker build
        run: make docker/images/pqs/build
      - name: Docker build-debug
        run: make docker/images/pqs/build-debug
      - run: ls -alhR .dist/
      - name: Docker build push
        run: make docker/images/pqs/build BAKE_ACTION='--push' GAR_REPOSITORY='da-images/public'
      - name: Docker build-debug push
        run: make docker/images/pqs/build-debug BAKE_ACTION='--push' GAR_REPOSITORY='da-images/public'

  ship-component:
    runs-on: digital-asset-participant-query-store
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix
      - uses: ./.github/actions/gen-version
      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: europe-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.DA_IMAGES }}
      - name: Restore dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: .dist
      - name: Populate dpm component
        run: make populate-component-yaml
      - run: ls -alhR .dist/
      - name: Push dpm component to da-images/public
        run: make publish-component ASSISTANT_ARGS="oci://europe-docker.pkg.dev/da-images/public/components"

  ship-helm:
    runs-on: digital-asset-participant-query-store
    needs: ship-docker
    steps:
      - uses: actions/checkout@v5
      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: europe-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.DA_IMAGES }}
      - name: Helm Build and Publish (Stable)
        uses: ./.github/actions/helm-build-push
        with:
          chart: charts/participant-query-store
          registry: europe-docker.pkg.dev/da-images/public/charts
          version: ${{ github.ref_name }}
          username: _json_key
          password: ${{ secrets.DA_IMAGES }}
