name: Performance
on:
  schedule:
    - cron: "0 2 * * *" # Nightly at 02:00 UTC
  workflow_dispatch: # Enables manual triggering

env:
  MILL_OPTS: "-Dcoursier.cache.dir=/data/coursier"

defaults:
  run:
    shell: bash -euo pipefail -c "source nix.source && exec bash -euo pipefail {0}"

jobs:
  perf-test:
    runs-on: digital-asset-participant-query-store
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix
      - name: git lfs pull
        run: git lfs install --local && git lfs pull
      - uses: ./.github/actions/gen-version
        id: gen-version
      - run: make prefetch-deps
      - name: Build & Package
        run: make build package
      - name: Perf tests
        run: make perf-test
      - name: Send slack notification
        if: failure() && github.event_name == 'schedule'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ":rotating_light: Performance tests failed"
            attachments:
              - color: "#FF0000"
                blocks:
                  - type: section
                    fields:
                      - type: mrkdwn
                        text: "*Repository:*\n${{ github.repository }}"
                      - type: mrkdwn
                        text: "*Branch:*\n${{ matrix.branch }}"
                  - type: actions
                    elements:
                      - type: button
                        text:
                          type: plain_text
                          text: "Visit job"
                        url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
